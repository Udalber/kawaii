{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<main class="login-container">
    <h1>Bienvenido 🌸</h1>

    {% if error %}
        <div style="background: #fde8e8; color: #c81e1e; padding: 10px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; width: 100%; text-align: center; border: 1px solid #f8b4b4;">
            {{ error }}
        </div>
    {% endif %}

    <form class="login-form" method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Usuario o Correo" required>

        <div class="password-container">
            <input type="password" name="password" id="password" placeholder="Contraseña" required>
            <span class="toggle-password" onclick="togglePassword()">👁</span>
        </div>

        <button type="submit">Ingresar</button>
    </form>

    <p class="register-text">
        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
    </p>

    <p class="register-text">
        ¿No tienes una cuenta?
        <a href="{% url 'register' %}">Regístrate gratis</a>
    </p>
</main>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    password.type = password.type === "password" ? "text" : "password";
}
</script>
{% endblock content %}
